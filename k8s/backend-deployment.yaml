apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: smartcomply-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: smartcomply-config