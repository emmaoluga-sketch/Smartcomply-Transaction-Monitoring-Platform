services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartcomply
      POSTGRES_USER: smartcomply
      POSTGRES_PASSWORD: smartcomply
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py makemigrations customers transactions rules audit &&
             python manage.py migrate &&
             python manage.py seed_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: sh -c "sleep 5 && python manage.py process_events"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    restart: on-failure

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

  rust-service:
    build: ./rust-service
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  pgdata: